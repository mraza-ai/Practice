<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VCF Architect Practice Exam</title>
<style>
:root{--bg:#0f172a;--card:#111827;--card2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--accent:#2563eb;--accent2:#38bdf8;--green:#16a34a;--red:#dc2626;--border:#334155}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1e3a8a 0,var(--bg) 44%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.page{max-width:1080px;margin:0 auto;padding:20px 14px 44px}.hero{text-align:center;padding:24px 8px 18px}
h1{font-size:clamp(34px,8vw,70px);line-height:.95;margin:0;letter-spacing:-.04em}.badge{display:inline-block;background:var(--accent);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:14px}
.subtitle,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.cardbtn,.card{background:rgba(17,24,39,.94);border:1px solid var(--border);border-radius:18px;color:var(--text)}
.cardbtn{padding:22px;text-align:left;cursor:pointer;min-height:142px}.cardbtn:hover,.btn:hover{border-color:var(--accent2)}.count{display:block;font-size:42px;font-weight:900;margin:10px 0}.small{font-size:13px;color:var(--muted)}
.card{padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.22)}.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);border-bottom:1px solid var(--border);padding:10px 12px;backdrop-filter:blur(8px)}
.topbar-inner{max-width:1080px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.progress-wrap{flex:1 1 260px}.progress-line{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:5px}
.progress{height:8px;background:#020617;border-radius:999px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
.stem{font-size:20px;line-height:1.45;white-space:pre-wrap;margin:14px 0 18px}.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);background:#0b1220;color:var(--text);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer}.choice.selected{border-color:var(--accent2);background:#123055}.choice.correct{background:#14532d;border-color:#22c55e}.choice.wrong{background:#7f1d1d;border-color:#ef4444}
.label{min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#334155;font-weight:900}.feedback{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0b1220;line-height:1.5}.feedback.good{border-color:#22c55e}.feedback.bad{border-color:#ef4444}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:5px 9px;color:#cbd5e1;font-size:12px;margin:3px}.domainbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}.score{font-size:54px;font-weight:900;margin:8px 0}.review{display:grid;gap:14px;margin-top:18px}.reviewitem{border-left:5px solid var(--border);padding:14px;border-radius:14px;background:rgba(17,24,39,.94)}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}.stat{background:rgba(17,24,39,.94);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}.stat b{font-size:28px}
@media(max-width:640px){.page{padding:14px 10px 34px}.topbar-inner{align-items:stretch}.btn{padding:10px;font-size:14px}.stem{font-size:18px}.choice{padding:12px}h1{font-size:40px}}
</style></head><body><div id="app"></div><script>
const QUESTIONS_RAW = [{"id": 1, "stem": "An architect is designing for a greenfield VMware Cloud Foundation (VCF) solution. This would be the first VCF Fleet in the VCF solution, and the customer would like to start with a minimal footprint with the option to scale up and out later. Which VCF Operations deployment model should the architect choose?", "choices": {"A": "Advanced", "B": "High Availability", "C": "Simple", "D": "Standard"}, "correct": ["C"], "explanation": "The Simple deployment model is designed for minimal footprint with a single VCF Operations instance, making it the ideal starting point for a greenfield deployment. It supports scale-out as needs grow. The Advanced model adds complexity and additional components beyond what a minimal deployment requires. High Availability adds redundancy overhead. Standard is a multi-node deployment that exceeds a minimal footprint requirement.", "domain": "VCF"}, {"id": 2, "stem": "Which four component areas are provided by a VMware Kubernetes Service (VKS) cluster?", "choices": {"A": "Identity federation, persistent logging, firewall services, and monitoring.", "B": "Authentication, external storage, virtual machine networking, and DNS services.", "C": "Authorization, backup services, VLAN segmentation, and DHCP.", "D": "Authentication and authorization, storage integration, pod networking, and load balancing."}, "correct": ["D"], "explanation": "VKS (VMware Kubernetes Service) clusters provide four core component areas: Authentication and authorization (RBAC integration), storage integration (CSI drivers for persistent volumes), pod networking (CNI plugin providing pod-to-pod communication), and load balancing (for exposing services externally). The other options include infrastructure concerns such as firewall services, DHCP, and VLAN segmentation that are not VKS cluster responsibilities.", "domain": "NSX"}, {"id": 3, "stem": "An architect is designing a VMware Cloud Foundation (VCF) solution for a customer. During the discovery phase, the customer outlined the following availability requirements: Business-critical workloads: RPO = 2 hours. Infrastructure components: RTO = 8 hours. Based on this context, what does the RTO metric represent?", "choices": {"A": "The maximum allowable time within which a system or service must be restored to a usable state", "B": "The maximum amount of data loss that is considered acceptable during a failure", "C": "The minimum volume of data loss tolerated in the event of a disruption", "D": "The minimum acceptable duration required to recover a service to an operational state"}, "correct": ["A"], "explanation": "RTO (Recovery Time Objective) defines the maximum allowable time within which a system or service must be restored to a usable state after a failure or disruption. In this scenario, infrastructure components must be restored within 8 hours. Options B and C describe RPO (Recovery Point Objective), which measures acceptable data loss. Option D incorrectly states minimum duration - RTO is a maximum tolerable downtime ceiling, not a minimum.", "domain": "SDDC Manager"}, {"id": 4, "stem": "What open source project does vSphere Supervisor use to automate the lifecycle management of VMware Kubernetes Service (VKS) clusters?", "choices": {"A": "Cluster API", "B": "Grafana", "C": "Contour", "D": "Kubeadm"}, "correct": ["A"], "explanation": "vSphere Supervisor uses the Cluster API (CAPI) open source project to declaratively manage the lifecycle of VKS clusters, including creation, scaling, upgrades, and deletion. Cluster API provides a Kubernetes-native way to manage Kubernetes cluster infrastructure. Grafana is a monitoring and observability platform. Contour is a Kubernetes ingress controller. Kubeadm is a bootstrap tool for initializing Kubernetes nodes, not for lifecycle management of clusters within a Supervisor environment.", "domain": "SDDC Manager"}, {"id": 5, "stem": "An architect is responsible for designing a new VMware Cloud Foundation (VCF)-based Private Cloud solution. During the requirements gathering workshop with key customer stakeholders, the following information was captured: The solution must support running 50,000 workloads concurrently across all sites. The solution must support the concurrent deployment of up to 10 workloads. When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Manageability", "B": "Recoverability", "C": "Performance", "D": "Availability"}, "correct": ["C"], "explanation": "Both requirements describe capacity and throughput constraints - how much the system must handle concurrently - which maps to the Performance design quality. Performance covers response time, throughput, resource utilization, and concurrency. Availability relates to uptime and fault tolerance. Manageability addresses ease of administration and operational efficiency. Recoverability addresses recovery from failures and meeting RPO/RTO objectives.", "domain": "SDDC Manager"}, {"id": 6, "stem": "An architect is responsible for designing a VMware Cloud Foundation (VCF)-based solution for a customer. The customer has the following requirement: There should be no single points of failure within the solution. To comply with the customer requirement, the architect has decided to include physical NIC teaming for all ESX servers in the design. When documenting this design decision, which consideration should the architect make?", "choices": {"A": "Embedded NICs should not be used for NIC teaming.", "B": "Each NIC team must include NICs from the same physical NIC Card.", "C": "Each NIC team must include NICs from different physical NIC Cards.", "D": "Only 10GbE NICs should be used for NIC teaming."}, "correct": ["C"], "explanation": "To eliminate a single point of failure through NIC teaming, each NIC team must include NICs from different physical PCIe NIC cards. If both NICs in a team reside on the same physical card, a card failure takes down the entire team, reintroducing a single point of failure. Option B (same card) is the antipattern that defeats the purpose of teaming. Embedded NICs can be used in NIC teams. Speed requirements (10GbE) are a separate design consideration unrelated to eliminating single points of failure.", "domain": "SDDC Manager"}, {"id": 7, "stem": "An architect is designing a solution with Istio Service Mesh. What two types of groups can collect and manage objects? (Choose two.)", "choices": {"A": "Cluster", "B": "Service", "C": "Security", "D": "API", "E": "Node"}, "correct": ["B", "C"], "explanation": "In Istio Service Mesh (as implemented through Tetrate Service Bridge), the two group types that collect and manage objects are Service groups (manage traffic configuration objects) and Security groups (manage AuthorizationPolicy, PeerAuthentication, RequestAuthentication objects). Cluster is an infrastructure concept, not an Istio object group. Node is a Kubernetes compute resource. API is too generic.", "domain": "SDDC Manager"}, {"id": 8, "stem": "Why would an architect specify the default NSX segment profiles in a VMware Cloud Foundation (VCF) design?", "choices": {"A": "Default segment profiles are required for VLAN-backed segments and cannot be overridden.", "B": "Default segment profiles offer enhanced performance and are automatically optimized for overlay traffic.", "C": "Default segment profiles enable distributed firewall policy enforcement and avoid the need for overlay segments.", "D": "Default segment profiles provide sufficient security and operational baseline settings for most common workloads and simplify lifecycle management."}, "correct": ["D"], "explanation": "Specifying default NSX segment profiles in the design establishes a consistent operational and security baseline for most workloads, reducing configuration drift and simplifying lifecycle management. Default profiles can be overridden per-segment when needed, making Option A incorrect. Default segment profiles do not automatically optimize performance for overlay traffic (Option B). Default segment profiles do not replace or eliminate the need for overlay segments, nor do they solely enable distributed firewall enforcement (Option C).", "domain": "NSX"}, {"id": 9, "stem": "A cloud architect is designing a VMware Cloud Foundation (VCF) Automation solution for an organization. The design must fulfill the following requirements: The design must minimize provider infrastructure lifecycle tasks. The design must minimize infrastructure management overhead. Each tenant must have isolated compute infrastructure. Which of the following deployment models best meets these requirements?", "choices": {"A": "Single VCF instance with dedicated Workload Domains per tenant", "B": "Consolidated VCF deployment per tenant", "C": "Dedicated VCF instances per tenant in a Standard Architecture", "D": "Shared Workload Domain for tenants"}, "correct": ["A"], "explanation": "A single VCF instance with dedicated Workload Domains per tenant balances all three requirements: a single VCF instance minimizes provider infrastructure lifecycle tasks and management overhead, while dedicated Workload Domains provide each tenant with isolated compute infrastructure (separate vCenter, NSX, and cluster resources). Option B (consolidated per tenant) increases complexity. Option C (dedicated VCF instances per tenant) maximizes management overhead contrary to the requirements. Option D (shared Workload Domain) breaks compute isolation.", "domain": "NSX"}, {"id": 10, "stem": "An architect is designing for a VMware Cloud Foundation (VCF) Instance. The following requirements and constraints were documented: The management domain cluster utilizes vSAN stretched as the principal storage. Company policy states that compute and storage capacity utilization must not exceed 90% at all times. Which three statements should the architect consider when designing the solution to satisfy the requirements? (Choose three.)", "choices": {"A": "Use a homogenous cluster configuration.", "B": "Size and monitor the cluster for a maximum compute peak utilization of < 45%.", "C": "Use a heterogeneous cluster configuration.", "D": "Size and monitor the cluster for a maximum storage utilization of 40%.", "E": "Size and monitor the cluster for a maximum compute peak utilization of < 90%.", "F": "Size and monitor the cluster for a maximum storage utilization of 90%."}, "correct": ["A", "B", "D"], "explanation": "vSAN stretched clusters require: (A) A homogeneous cluster configuration - vSAN stretched cluster mandates identical hardware across all nodes for consistent performance and supportability. (B) Maximum compute peak utilization below 45% - with vSAN stretched, the cluster must tolerate a full site failure; each site holds 50% of capacity, so staying under 45% peak ensures the surviving site can handle all workloads without exceeding the 90% policy. (D) Maximum storage utilization of 40% - vSAN stretched mirrors data across both sites (FTT=1 stretched), consuming 2x storage; combined with rebuild headroom, staying at 40% satisfies the 90% policy threshold.", "domain": "vSAN"}, {"id": 11, "stem": "An architect is designing a private cloud for HR and Finance departments. HR and Finance superusers require access to VCF Operations. VCF Operations access, monitoring, and logging must not be shared across departments. Which design decision would meet the requirement?", "choices": {"A": "Deploy two VCF Fleet instances, one for HR and one for Finance.", "B": "Configure two tenant instances within VCF Operations, one for HR and one for Finance.", "C": "Deploy two VCF Operations instances within a VCF Fleet, one for HR and one for Finance.", "D": "Configure two sets of scopes and index partitions within VCF Operations, one for HR and one for Finance."}, "correct": ["D"], "explanation": "VCF Operations Scopes limit user access to specific objects per department. Index Partitions isolate logging data per department within a single VCF Operations instance. This satisfies both the access isolation and logging isolation requirements without deploying separate instances.", "domain": "VCF"}, {"id": 12, "stem": "The architect documented a requirement for 99.95% high availability to meet the customer's resiliency needs. Which two physical design decisions will help meet this requirement in the management domain? (Choose two.)", "choices": {"A": "Configure vCenter HA for the management domain vCenter server.", "B": "ESX Host Uplink Setting: EtherChannel = Enable", "C": "Advanced Cluster Setting: das.iostatsinterval = 0", "D": "Set the restart priority policy for the vCenter Server appliance to high.", "E": "ESX Host Uplink Setting: EtherChannel = Disable"}, "correct": ["D", "E"], "explanation": "vCenter HA is explicitly NOT supported in VCF. Setting vSphere HA restart priority to HIGH for vCenter ensures it restarts first after host failure. EtherChannel = Disable is the correct default for management domain uplinks using standard failover teaming - enabling EtherChannel without IP hash causes network disruptions. das.iostatsinterval=0 is a performance tuning parameter, not an HA decision.", "domain": "SDDC Manager"}, {"id": 13, "stem": "A company is deploying a new VCF environment to support growing infrastructure, planning to scale by adding more workload domains as new applications and departments are onboarded. The architecture must be highly scalable and flexible. Which design decision should the architect make to facilitate future growth?", "choices": {"A": "Use a single workload domain for all departments and increase the size of the vSphere clusters as demand grows.", "B": "Use multiple workload domains for each department and ensure that each workload domain is independently scaled.", "C": "Use a single workload domain and rely on storage and network scaling to accommodate future growth.", "D": "Use multiple workload domains for each department but combine them into a single vSphere cluster to reduce complexity."}, "correct": ["B"], "explanation": "Multiple workload domains allow each department to scale independently with its own vCenter, NSX, and resources. A and C create scaling constraints since a single WLD shares one vCenter. D is invalid - workload domains cannot share a single vSphere cluster.", "domain": "NSX"}, {"id": 14, "stem": "An architect is designing a VCF deployment: Tenants need dedicated external network access. The number of NSX Edge clusters should be minimized. The architect decided to use a Workload Networking VPC with Full Services Model. Which additional design decision should be considered as part of the logical network design?", "choices": {"A": "Deploy the maximum number of 10 NSX Edges into a single Edge cluster.", "B": "Install two NSX bare metal Edges with multiple physical interfaces to separate tenants.", "C": "Use Virtual Routing and Forwarding (VRF) lite to create a separate VRF TO Gateway for each tenant.", "D": "Use NSX Federation providing a dedicated NSX instance for each tenant."}, "correct": ["C"], "explanation": "VRF lite allows multiple VRFs to share a single NSX Edge node, providing dedicated external network access per tenant while minimizing Edge clusters. VRFs provide similar capabilities to dedicated Tier-0 Gateways without requiring separate edge nodes.", "domain": "NSX"}, {"id": 15, "stem": "An architect documents the following design decision: Two vSphere clusters will be deployed within the single VI workload domain. What statement should the architect include as an implication of this design decision?", "choices": {"A": "If the solution needs to be scaled at a future date, additional VI workload domains can be deployed.", "B": "Deploying multiple clusters in the single VI workload domain reduces the number of vCenter Server instances that must be managed.", "C": "Deploying multiple clusters within the single VI workload domain meets the requirement to segregate Production and Development workloads.", "D": "All clusters within the single VI workload domain must use vSAN as their principal storage type."}, "correct": ["B"], "explanation": "A workload domain has one vCenter instance managing all its clusters. Two clusters in one WLD means one vCenter manages both, reducing vCenter instances to manage. C is incorrect - Production/Dev segregation requires separate WLDs. D is incorrect - clusters in the same WLD can use different storage types.", "domain": "vSAN"}, {"id": 16, "stem": "As part of the VCF logical design, the architect documented: The solution must be able to support latency-sensitive workloads. Which two physical design decisions will meet this performance requirement in the workload domain? (Choose two.)", "choices": {"A": "Intel TDX and AMD's SEV-SNP integration", "B": "Advanced Memory Tiering with NVMe: Enabled", "C": "vSAN Global Deduplication: Enabled", "D": "NSX Enhanced Data Path: Enabled", "E": "vSAN Deep Snapshots: Enabled"}, "correct": ["B", "D"], "explanation": "Advanced Memory Tiering with NVMe optimizes memory by moving VM pages between DRAM and NVMe devices, improving host CPU utilization for latency-sensitive workloads. NSX Enhanced Data Path (EDP) delivers 50-70% network performance improvement using DPDK-based operations, critical for latency-sensitive workloads. TDX/SEV-SNP are security features. vSAN Global Deduplication adds CPU overhead. vSAN Deep Snapshots is a data protection feature.", "domain": "NSX"}, {"id": 17, "stem": "An architect is planning resources for a new cluster containing a mission-critical application with five resource-intensive VMs. Requirements: N+1 availability standard, minimize hardware investment. Which two design recommendations should the architect make? (Choose two.)", "choices": {"A": "Use automated placement rules to keep the mission-critical application virtual machines apart.", "B": "Use resource pools to prioritize resource for the mission-critical application virtual machines.", "C": "Use automated placement rules to keep the mission-critical application virtual machines together.", "D": "Create a cluster with six hosts.", "E": "Create a cluster with five hosts."}, "correct": ["A", "D"], "explanation": "N+1 with 5 resource-intensive VMs requires 6 hosts (5+1) so one host failure still leaves capacity for all VMs to run. VM-VM anti-affinity rules (keep VMs apart) ensure each of the 5 critical VMs runs on a different host - a single host failure only takes down one VM. Resource pools prioritize but don't protect availability. Keeping VMs together (C) defeats N+1. 5 hosts provides no N+1 capacity.", "domain": "SDDC Manager"}, {"id": 18, "stem": "A customer has a new initiative to build a private cloud based on VCF. Based on the notes captured by the architect, which statement should be documented as a constraint?", "choices": {"A": "The existing storage is out of hardware vendor maintenance.", "B": "No funding exists for a new storage array. Therefore, existing storage hardware must be used.", "C": "The design must address security zone requirements for management, production, dev/test, and QA workloads.", "D": "The design must provide a centralized management console to manage both data centers."}, "correct": ["B"], "explanation": "A constraint restricts the design by removing the architect's ability to decide. 'No funding - must use existing storage' is a budget constraint that dictates what hardware must be used. A is a risk. C and D are requirements.", "domain": "vSAN"}, {"id": 19, "stem": "VMware Kubernetes Service (VKS) cluster exposes three layers of controllers to manage its lifecycle. Which set correctly identifies these layers?", "choices": {"A": "Virtual Machine Service, vCenter Appliance, Supervisor Service.", "B": "Cluster API, Node Problem Detector, CNI Plugin.", "C": "API Gateway, StatefulSet Controller, Ingress Controller.", "D": "Virtual Machine Service, Cluster API, and Cloud Provider Plugin."}, "correct": ["D"], "explanation": "VKS exposes three controller layers: Virtual Machine Service (manages VM lifecycle for Kubernetes worker nodes), Cluster API (manages Kubernetes cluster lifecycle), and Cloud Provider Plugin (integrates Kubernetes with vSphere/VCF infrastructure for storage, networking, and load balancing).", "domain": "vSAN"}, {"id": 20, "stem": "During a design workshop, the customer stated: Business units should not be able to interfere with the operations of a different business unit. The architect decides to enable multi-tenancy within VCF Automation. Which two design implications would also need to be documented? (Choose two.)", "choices": {"A": "Each Tenant must use an embedded VCF Operations orchestrator instance.", "B": "Each Tenant must use an external VCF Operations orchestrator instance.", "C": "The Provider Tenant must use the embedded VCF Operations orchestrator instance.", "D": "All Tenants must use a single VCF Operations orchestrator instance.", "E": "The Provider Tenant must use an external VCF Operations orchestrator instance."}, "correct": ["B", "C"], "explanation": "When multi-tenancy is enabled in VCF Automation, the Provider Tenant uses the embedded VCF Operations orchestrator instance, while each additional Tenant must use an external VCF Operations orchestrator instance. This provides the required isolation so business units cannot interfere with each other.", "domain": "VCF"}, {"id": 21, "stem": "Requirements and constraints: 3 datacenters within 1 mile radius, high-speed LAN connectivity. Private cloud must be hosted at HQ datacenter. Must protect against datacenter loss with no data loss (RPO = 0). Which design model meets these requirements?", "choices": {"A": "VCF fleet with disaster recovery on a multi-rack cluster model", "B": "VCF fleet with disaster recovery on a single-rack cluster model", "C": "VCF fleet with fault domains on a multi-rack cluster model", "D": "VCF fleet with fault domains on a stretched cluster model"}, "correct": ["D"], "explanation": "RPO=0 requires synchronous replication, which vSAN stretched clusters provide. 3 datacenters within 1 mile with high-speed LAN matches stretched cluster requirements (max 5ms RTT between sites). DR options (A and B) use asynchronous replication and cannot guarantee RPO=0.", "domain": "vSAN"}, {"id": 22, "stem": "An organization is designing a VCF solution hosting a business-critical database. Requirements: All WLDs use vSAN. RPO = 5 minutes maximum. RTO = 30 minutes with automated failover. Performance impact minimized. Which design approach aligns with these requirements?", "choices": {"A": "Configure backup-based recovery with backup jobs scheduler set to every 30 minutes.", "B": "Use asynchronous replication with snapshots taken every 30 minutes to reduce storage impact.", "C": "Use vSAN stretched cluster.", "D": "Use synchronous replication on the storage array level."}, "correct": ["C"], "explanation": "vSAN stretched cluster provides near-synchronous replication between sites (RPO within seconds, well under 5 minutes), automated failover (RTO within minutes, well under 30), and minimal performance impact. Storage array replication violates 'all WLDs use vSAN'.", "domain": "vSAN"}, {"id": 23, "stem": "An architect is meeting with key stakeholders and SMEs for the first time as part of requirements gathering. Names, job titles, project timelines and budget have been provided. What step should the architect perform as part of this initial requirements gathering workshop?", "choices": {"A": "Open the meeting with a diagram of the VCF topology that must meet the customer requirements in order to start a discussion.", "B": "Ask questions to agree on the key product features the SMEs want from the design.", "C": "Open the meeting with a list of the VCF design decisions from the public documentation to agree on any required changes.", "D": "Ask questions to start a discussion on the business objectives and desired outcomes."}, "correct": ["D"], "explanation": "At an initial requirements gathering workshop, the architect must first understand business objectives and desired outcomes before any technical discussion. Presenting topology diagrams (A) or vendor documentation (C) assumes requirements not yet gathered.", "domain": "NSX"}, {"id": 24, "stem": "During requirements gathering, the customer stated: Platinum applications must have 99.99% availability SLA. Gold = 99.9%. Silver = 99%. Private cloud = 99.9%. What should the architect recommend to meet these requirements?", "choices": {"A": "The private cloud must only be used to host Silver and Gold services.", "B": "The private cloud SLA can only be met using multiple VMware Cloud Foundation instances configured as a single VCF Fleet.", "C": "The Platinum service availability requirements must be met by the application.", "D": "The Platinum service availability requirements must be met by configuring Proactive High Availability (HA) on the workload domain."}, "correct": ["C"], "explanation": "99.99% (four nines) cannot be guaranteed at the infrastructure layer alone. Application-level HA (active/active clustering, load balancing, application-level failover) is required to reach 99.99%. The private cloud infrastructure provides the 99.9% foundation.", "domain": "VCF"}, {"id": 25, "stem": "During the design workshop, the customer stated: The solution will support secure communication. Which design decision should be included in the logical design for the workload domain?", "choices": {"A": "Use a SHA-2 algorithm or higher for signed certificates.", "B": "Set promiscuous mode port group security policy to reject.", "C": "Verify all physical components used for the deployments are on the hardware compatibility list.", "D": "Ensure the host servers have TPM 2.0 hardware."}, "correct": ["A"], "explanation": "SHA-2 for signed certificates is explicitly listed in the Lecture Manual as a logical design decision for secure communication. HCL verification (C) and TPM 2.0 (D) are physical design decisions.", "domain": "VCF"}, {"id": 26, "stem": "A large financial institution designing VCF: Physical network managed by outsourced team and cannot be reconfigured. All hosts must use Link Aggregation. Storage is disaggregated with NFS as principal storage. Each server has four 25GbE NICs: two for management/vMotion/VM traffic; two for NFS storage fabric. How does this impact the overall design?", "choices": {"A": "Link Aggregation cannot be used in the Workload Domain.", "B": "NIC teaming for Virtual Standard Switch (vSS) must be configured.", "C": "Multiple Link Aggregation Groups are not supported.", "D": "Link Aggregation cannot be used in the Management Domain."}, "correct": ["C"], "explanation": "The scenario requires two separate fabrics, each needing a separate LAG. Only a single LAG per VDS is supported in VCF. With two separate physical fabrics requiring separate LAGs, this creates a design constraint - multiple LAGs cannot be configured simultaneously.", "domain": "vSAN"}, {"id": 27, "stem": "Which two VCF components are replicated across availability zones in a VMware Cloud Foundation (VCF) Fleet with Disaster Recovery model design with two availability zones? (Choose two.)", "choices": {"A": "VCF Automation", "B": "vCenter", "C": "SDDC Manager", "D": "NSX", "E": "VCF Operations"}, "correct": ["B", "D"], "explanation": "In a VCF Fleet with Disaster Recovery across two availability zones, vCenter and NSX are replicated to the DR site so they can manage recovered workloads after failover. SDDC Manager remains at the primary site and is not replicated.", "domain": "NSX"}, {"id": 28, "stem": "An architect identified: RISK001 - There is a risk that frequent infrastructure design changes may break Disaster Recovery plans and Service Level Objectives. What should the architect suggest to mitigate this risk?", "choices": {"A": "Setup monitoring and alerting against defined infrastructure service level objectives.", "B": "Develop a process to review and update DR plans between changes and schedule monthly end-to-end DR tests.", "C": "Limit infrastructure design change frequency to a maximum of once a month.", "D": "Configure VM replication with recovery point objective of 5 minutes or less for all workloads from the primary to DR site."}, "correct": ["B"], "explanation": "The risk is that changes break DR plans. The correct mitigation is a process to review/update DR plans whenever changes occur AND regularly test them. Monitoring (A) detects failures but doesn't prevent DR plan invalidation.", "domain": "SDDC Manager"}, {"id": 29, "stem": "During requirements gathering, the following was captured: The solution must ensure that all workloads running on the platform comply with the Payment Card Industry Data Security Standard (PCI-DSS). When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Manageability", "B": "Performance", "C": "Recoverability", "D": "Security"}, "correct": ["D"], "explanation": "PCI-DSS is a security and compliance standard. PCI-DSS requirements relate to data protection, access controls, encryption, audit logging, and compliance - all Security design quality.", "domain": "SDDC Manager"}, {"id": 30, "stem": "The architect documented a requirement for 99.95% high availability to meet the customer's resiliency needs. Which two physical design decisions will help meet this requirement in the management domain? (Choose two.)", "choices": {"A": "Management Port Group: Route based on physical NIC load", "B": "Host Overlay DHCP Scope Lease: 14 Days", "C": "Physical Switch MTU: 9000", "D": "vSAN Cache Tier Sizing: 800GB", "E": "Host isolation response: Power Off and restart VM"}, "correct": ["A", "E"], "explanation": "Route based on physical NIC load is the recommended load balancing for VDS management port groups. Host isolation response: Power Off and restart VM ensures vSphere HA can restart VMs on healthy hosts when a host detects network isolation, critical for 99.95% availability.", "domain": "NSX"}, {"id": 31, "stem": "Requirements: REQ01 - The solution must provide a self-service catalog. REQ02 - The solution must support the segregation of Development and Production resources (networks, virtual machines, users). When documenting the design decisions, which statement should the architect include?", "choices": {"A": "VCF Automation does not support the use of multiple Active Directory domains.", "B": "Separate workload domains must be configured to provide segregation between the Development and Production environments.", "C": "VCF Automation will be configured with separate service catalog instances for Development and Production.", "D": "VCF Automation will be configured with separate organizations for Development and Production."}, "correct": ["D"], "explanation": "VCF Automation uses Organizations as the primary multi-tenancy construct. Separate organizations for Dev and Production provides separate self-service catalogs (REQ01) and complete segregation of networks, VMs, and users (REQ02).", "domain": "VCF"}, {"id": 32, "stem": "When designing a backup and recovery solution for VKS clusters, which tool can be leveraged to back up and restore workloads?", "choices": {"A": "Site Recovery Manager", "B": "Velero", "C": "Restic", "D": "VMware Live Recovery"}, "correct": ["B"], "explanation": "Velero is the standard Kubernetes-native backup and restore tool for VKS clusters, explicitly listed in VCF 9.0 documentation as a supported Tanzu package. Site Recovery Manager is for VM-level DR. VMware Live Recovery is for VM-level disaster recovery.", "domain": "SDDC Manager"}, {"id": 33, "stem": "An architect has assumed that existing support staff are adequately skilled to operate the proposed infrastructure design. The risk is that existing support staff are inadequately skilled. How would the architect mitigate the risk?", "choices": {"A": "Hire additional support staff with the same skillsets to add more support capacity.", "B": "Allocate the necessary time and budget to train existing support staff on the necessary skills required to operate.", "C": "Complete a skills assessment of the existing support staff to identify the skill gap.", "D": "Engage a third-party company to deploy and configure the proposed solution."}, "correct": ["C"], "explanation": "The assumption is staff are adequately skilled, and the risk is they are not. The correct first mitigation step is to validate the assumption by conducting a skills assessment to identify the actual gap.", "domain": "NSX"}, {"id": 34, "stem": "During a VCF architectural design workshop, one stakeholder stated: 'The company has just used the remaining budget to purchase eight vSAN Ready Nodes for this project.' How would the architect classify this statement within the conceptual model document?", "choices": {"A": "Requirement", "B": "Risk", "C": "Assumption", "D": "Constraint"}, "correct": ["D"], "explanation": "This is a Constraint: hardware has already been purchased (cannot be changed), the design is restricted to exactly 8 nodes, budget is exhausted. It is not a requirement, not a risk (it's confirmed), and not an assumption (it's a confirmed fact).", "domain": "vSAN"}, {"id": 35, "stem": "Requirement: The solution must identify any configuration changes made to the Management Infrastructure every 30 days. Which three design decisions should the architect make to meet the stated requirements? (Choose three.)", "choices": {"A": "Configure a Configuration Template for the Management Cluster.", "B": "Schedule Configuration Drift to Check the configuration every 30 days.", "C": "Configure a Configuration Template for the Management vCenter.", "D": "Create a Configuration Template for the Management NSX Manager.", "E": "Schedule Configuration Drift to Remediate the configuration every 30 days.", "F": "Configure Host Profiles for the Workload Domain."}, "correct": ["A", "B", "C"], "explanation": "Configuration Templates for the Management Cluster (A) and Management vCenter (C) define the baseline configuration to check against. Scheduling Configuration Drift to CHECK every 30 days (B) identifies deviations matching the requirement to 'identify' changes. E (Remediate) goes beyond the requirement which only asks to identify, not fix.", "domain": "NSX"}, {"id": 36, "stem": "During requirements gathering, the following was captured: The solution must ensure that all components meet a software version of N-1. When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Recoverability", "B": "Manageability", "C": "Security", "D": "Availability"}, "correct": ["B"], "explanation": "N-1 software version is a lifecycle management and software currency policy. Manageability is defined as 'Managing the infrastructure in terms of lifecycle management, scalability, and capacity planning.' Maintaining N-1 version ensures components remain vendor-supported.", "domain": "SDDC Manager"}, {"id": 37, "stem": "An organization is evacuating their datacenter and moving 800 workloads to a new datacenter. The migration must be completed with no downtime within a four-week change window. What migration method will meet the requirements?", "choices": {"A": "Cross vCenter vMotion", "B": "HCX OS Assisted Migration", "C": "HCX Bulk Migration", "D": "HCX Replication Assisted vMotion"}, "correct": ["D"], "explanation": "HCX Replication Assisted vMotion (RAV) pre-replicates VM disks in parallel during the 4-week window then uses vMotion at cutover for zero downtime. Cross vCenter vMotion is limited to 1 VM at a time. HCX OS Assisted Migration is for non-vSphere hypervisors and has downtime. HCX Bulk Migration powers off the source VM at switchover.", "domain": "SDDC Manager"}, {"id": 38, "stem": "During the design workshop, the customer stated: The solution must comply with the organization's security standards. Which two design decisions should be included in the logical design for the workload domain? (Choose two.)", "choices": {"A": "Use large-size NSX Edge virtual appliances to account for the additional firewall rules.", "B": "Enable VM Monitoring for each workload within the cluster.", "C": "Enable Inter-SR iBGP routing.", "D": "Use an SHA-2 algorithm or higher when signing certificates.", "E": "Establish an operations practice to capture and update the thumbprint of the NSX Local Manager certificate on the NSX Global Manager every time the certificate is updated."}, "correct": ["D", "E"], "explanation": "SHA-2 for certificates is explicitly documented as a logical security design decision. NSX Local Manager thumbprint operations practice is confirmed by design requirement VCF-NSX-GM-RCMD-SEC-001.", "domain": "NSX"}, {"id": 39, "stem": "Which design defines how to arrange and use components and features of the infrastructure to satisfy service dependencies and other relationships specified in the Conceptual Model?", "choices": {"A": "Physical Design", "B": "High Availability Design", "C": "Configuration Guide", "D": "Logical Design"}, "correct": ["D"], "explanation": "The Lecture Manual provides the exact definition: 'The logical design defines how to arrange and use components and features of the infrastructure to satisfy service dependencies and other relationships specified in the conceptual model. The logical design does not provide specific details about server hardware, port connections, or Fibre Channel zones.'", "domain": "vSAN"}, {"id": 40, "stem": "An architect has a constraint to use an existing storage array. Assumption 01: The existing storage array has sufficient capacity and performance. Risk 01: The performance and capacity may not be sufficient. How would the architect mitigate the risk?", "choices": {"A": "Ensure that the customer allocates budget for new hardware in case the risk is realized.", "B": "Setup a RAID mirror configuration on the existing storage array for redundancy.", "C": "Ignore the constraint and design the solution using VMware vSAN Express Storage Architecture (ESA).", "D": "Request for additional budget to purchase more Fibre Channel switches."}, "correct": ["A"], "explanation": "The constraint mandates using the existing storage array - the architect cannot change this. The correct mitigation is to ensure budget is allocated as a contingency for new hardware if the risk is realized during deployment.", "domain": "vSAN"}, {"id": 41, "stem": "A customer is designing a multi-site VCF and vSAN Data Protection architecture to ensure business continuity. The support team must validate the failover and recovery processes before being allowed to deploy into production. Which two validation activities should be included in the strategy? (Choose two.)", "choices": {"A": "Conduct recovery plan testing annually, as frequent testing may introduce instability in DR environments.", "B": "Assess the impact of failover scenarios on application dependencies and inter-site connectivity.", "C": "Configure recovery plans based on generic VMware best practices rather than workload-specific requirements to decrease the architecture complexity.", "D": "Perform planned and unplanned failover tests in a controlled environment to validate recovery time objectives.", "E": "Configure vSphere HA and DRS features to manage disaster recovery automatically, eliminating the need for additional validation."}, "correct": ["B", "D"], "explanation": "Assessing application dependencies and inter-site connectivity during failover is mandatory validation. Performing planned and unplanned failover tests in a controlled environment validates RTO adherence. Annual-only testing (A) is insufficient for pre-production validation.", "domain": "vSAN"}, {"id": 42, "stem": "An architect is gathering business requirements from customer stakeholders and SMEs. Which two factors should the architect discuss with the customer to determine any potential impact on the business requirements? (Choose two.)", "choices": {"A": "Service-level agreements (SLAs)", "B": "Product versions", "C": "Organizational structure", "D": "Average virtual machine size", "E": "Storage capacity"}, "correct": ["A", "C"], "explanation": "The Lecture Manual explicitly lists the common factors that affect business requirements including Organizational boundaries and Service-level agreements (SLAs). Product versions, average VM size, and storage capacity are technical inputs, not business factors.", "domain": "vSAN"}, {"id": 43, "stem": "During a requirements gathering workshop, the customer has provided a list of business and technical requirements. Which requirement should be classified as a business requirement?", "choices": {"A": "The solution needs to grow by 30% over the next three years.", "B": "The solution must consider security and resiliency to ensure continuity.", "C": "The solution must provide no Single Point of Failure (SPOF).", "D": "The solution should reduce operational costs."}, "correct": ["A"], "explanation": "The Lecture Manual explicitly lists 'The solution must scale by 20 percent over the next three years' as a canonical functional (business) requirement example. Option A (grow by 30% over 3 years) matches this exact pattern.", "domain": "SDDC Manager"}, {"id": 44, "stem": "An organization is building a VCF Private Cloud with objectives: Reduce duplicate systems costs, eliminate unsupported platform risks, reduce public cloud costs, eliminate documentation risks. Use cases: Migration, Containerization, Centralization and Consolidation. What should the architect include in the design documentation as part of the Conceptual Model?", "choices": {"A": "A constraint that the solution must be accessible via a HTTPS GUI to all relevant areas of the business.", "B": "A requirement that the solution will provide support for provisioning and managing workloads based on virtualization and containerization technologies.", "C": "An assumption that a complete mapping of application dependencies is not available.", "D": "A risk that the solution may not support the migration of containerized workloads."}, "correct": ["B"], "explanation": "The Containerization use case directly translates to a functional requirement: 'The solution will provide support for provisioning and managing workloads based on virtualization and containerization technologies.'", "domain": "SDDC Manager"}, {"id": 45, "stem": "Which type of storage is used by VKS pods to store non-persistent data?", "choices": {"A": "Container image storage", "B": "vSphere local storage", "C": "Object storage", "D": "Ephemeral storage"}, "correct": ["D"], "explanation": "The VCF 9.0 Design Doc confirms: 'A vSphere Pod requires ephemeral storage to store such Kubernetes objects as logs, emptyDir volumes, and ConfigMaps during its operations. This ephemeral, or transient, storage lasts as long as the pod continues to exist.'", "domain": "vSAN"}, {"id": 46, "stem": "During an initial design workshop, an Architect was provided with an overview of the current state and other information required to proceed to the design phase. Which statement should be documented as a requirement?", "choices": {"A": "Existing shared storage array must be used.", "B": "Block-based storage must be used within a workload domain.", "C": "Existing storage arrays provide sufficient capacity for building the environment.", "D": "The customer network team is not trained to support NSX VPC."}, "correct": ["B"], "explanation": "A requirement allows the architect to evaluate multiple design options. 'Block-based storage must be used' defines what must be achieved but leaves options open (iSCSI vs FC). Option A is a constraint. Option C is an assumption. Option D is a constraint or risk.", "domain": "NSX"}, {"id": 47, "stem": "Which VMware Cloud Foundation (VCF) Storage Model can be deployed to scale storage capacity independent of compute and network?", "choices": {"A": "vSAN Compute Cluster Storage Model", "B": "vSAN ESA Storage Model", "C": "vSAN Capacity Cluster Model", "D": "vSAN ESA Storage Cluster Model"}, "correct": ["D"], "explanation": "The vSAN ESA Storage Cluster Model is a dedicated disaggregated storage cluster with no VMs hosted on it, enabling storage to scale completely independently of compute and network. The vSAN ESA Storage Model (B) is the traditional HCI model where compute and storage scale symmetrically together.", "domain": "vSAN"}, {"id": 48, "stem": "A customer wants to: limit total active resource consumption per VCF Automation user, and ensure requests meet company requirements prior to deployment for certain users. Which two VCF Automation policies should the architect recommend? (Choose two.)", "choices": {"A": "IaaS Policy", "B": "Approval Policy", "C": "Resource Quota Policy", "D": "Deployment Limit Policy", "E": "Lease Policy"}, "correct": ["B", "C"], "explanation": "Resource Quota Policy (C) controls the amount of resources available to users. Approval Policy (B) adds a layer of governance before the requested resources can be deployed. Deployment Limit Policy limits per-deployment resources, not per-user. Lease Policy defines maximum deployment lifetime.", "domain": "VCF"}, {"id": 49, "stem": "An architect is designing a solution with Istio Service Mesh. What two types of groups can collect and manage objects? (Choose two.)", "choices": {"A": "Service", "B": "Cluster", "C": "Security", "D": "API", "E": "Node"}, "correct": ["A", "C"], "explanation": "In Istio Service Mesh (as implemented through Tetrate Service Bridge), the two primary group types that collect and manage objects are Service groups (traffic management configuration) and Security groups (AuthorizationPolicy, PeerAuthentication, RequestAuthentication).", "domain": "SDDC Manager"}, {"id": 50, "stem": "The following requirements were stated: All tier 1 production services must be restored to the secondary site within 1 hour. All tier 3 production services must be restored to the secondary site within 8 hours. In the context provided, what does the RTO determine?", "choices": {"A": "The maximum tolerable amount of time allowed before an application/service should be recovered to a usable state", "B": "The maximum amount of data loss that can be tolerated", "C": "The minimum tolerable amount of time allowed before an application/service should be recovered to a usable state", "D": "The minimum amount of data loss that can be tolerated"}, "correct": ["A"], "explanation": "The Lecture Manual defines RTO (Recovery Time Objective) as 'the maximum tolerable downtime - how long a system can be unavailable before it must be restored.' RPO is the maximum data loss tolerated.", "domain": "SDDC Manager"}, {"id": 51, "stem": "The company policy mandates that all VCF patches and upgrades must be tested in a development environment before applying to production. Which VCF construct design decision would comply with this mandate?", "choices": {"A": "Deploy two VCF vSphere Clusters within a VCF Domain.", "B": "Deploy two VCF Instances within a VCF Fleet.", "C": "Deploy two VCF Domains within a VCF Instance.", "D": "Deploy two VCF Fleets within a VCF Private Cloud."}, "correct": ["B"], "explanation": "Two VCF Instances within a fleet share VCF Operations/Automation but have separate upgrade lifecycles. Two clusters (A) or domains (C) share SDDC Manager - patching affects both. Two fleets (D) is over-engineering.", "domain": "VCF"}, {"id": 52, "stem": "During requirements gathering, the following was captured: The solution must support a yearly workload growth of up to 10%. When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Performance", "B": "Availability", "C": "Manageability", "D": "Security"}, "correct": ["C"], "explanation": "The Lecture Manual AMPRS table defines Manageability as 'Managing the infrastructure in terms of lifecycle management, scalability, and capacity planning.' Yearly workload growth of 10% is a scalability and capacity planning requirement - directly under Manageability.", "domain": "SDDC Manager"}, {"id": 53, "stem": "Existing environment: 3 vSphere clusters, 5 hosts each. Networking = vDS. Storage = NFSv3. Managed by single vCenter. Architect decides to create a new VCF fleet with a single VCF instance. What design implication should be documented?", "choices": {"A": "NSX will be automatically deployed during the creation of the VCF fleet.", "B": "The vCenter VM must be migrated to a standalone host before fleet creation.", "C": "The clusters will be automatically configured to use vSAN storage before the creation of the fleet.", "D": "The ESX hosts will be converted to use vSphere Lifecycle Manager baselines during the creation of the fleet."}, "correct": ["A"], "explanation": "The VCF 9.0 Design Doc confirms: 'Any missing VMware Cloud Foundation software components are automatically deployed and configured.' Since the existing vSphere environment has no NSX, VCF Installer automatically deploys NSX during fleet creation. vSphere Lifecycle Manager baselines are NOT supported in VCF 9.0 - image mode is required.", "domain": "NSX"}, {"id": 54, "stem": "An architect is expanding an existing private cloud based on VCF. The existing VCF instance is deployed with a single workload domain. The number of ESXi hosts has grown to the maximum number the existing vCenter can support. Which design decision would the architect need to make to allow the existing VCF Instance to add more ESXi hosts?", "choices": {"A": "Deploy a second vCenter server appliance within the existing workload domain", "B": "Deploy a second workload domain within the existing VCF Instance", "C": "Deploy a second cluster within the existing vCenter", "D": "Deploy a second VCF Instance within the existing VCF Fleet"}, "correct": ["B"], "explanation": "Each workload domain gets its own dedicated vCenter instance. Deploying a second workload domain causes VCF Operations to automatically deploy a new vCenter, which can then manage additional ESXi hosts independently. VCF does not support multiple vCenters within a single workload domain (A).", "domain": "VCF"}, {"id": 55, "stem": "Business Units pay for their own compute hardware. Business Units expect exclusive access to their compute hardware. IT Services maintains all compute within a single workload domain. IT Services designs and offers standardized catalog items. Which VCF Automation feature achieves this requirement?", "choices": {"A": "Project Constraints", "B": "Cloud Zones", "C": "Cloud Account", "D": "Project-Level Placement Policy"}, "correct": ["B"], "explanation": "Cloud Zones are sections of compute resources specific to a cloud account. The VCF 9.0 Design Doc confirms: 'Cloud zones cannot share compute resources.' Each business unit gets a Cloud Zone mapped to their specific compute cluster.", "domain": "VCF"}, {"id": 56, "stem": "Multiple business units with separate AD instances (from acquisitions). Each unit operates independently and requires dedicated development environments. Requirement: Provide self-service provisioning through VCF Automation. Which two design decisions should be included? (Choose two.)", "choices": {"A": "All tenants will be configured to use the corporate AD instance for authentication.", "B": "All tenants will be configured to use their dedicated AD instance for authentication.", "C": "A VCF Automation tenant will be created for each business unit.", "D": "A VCF Automation project will be created for each business unit.", "E": "All projects will be configured to use their dedicated AD instance for authentication."}, "correct": ["B", "C"], "explanation": "Every organization has its own identity source they connect to (B). A VCF Automation tenant per business unit (C) provides independent self-service provisioning and isolated resources. Authentication is at tenant level, not project level (E).", "domain": "VCF"}, {"id": 57, "stem": "Network security policy: Physical network divided into multiple security zones. Traffic cannot traverse zones. Physical servers may not connect to multiple zones via single NIC. Management/Storage traffic in zone 1. Workload traffic in zone 2. Architect uses two vSphere Distributed Switches per cluster. Which two additional design decisions should the architect include? (Choose two.)", "choices": {"A": "Configure one vSphere Distributed Switch for ESX Management, Storage, and vMotion traffic.", "B": "Configure one vSphere Distributed Switch for all storage traffic.", "C": "Configure one vSphere Distributed Switch for ESX Management, Storage, vMotion traffic and NSX - Host and Edge TEP/Edge Uplinks.", "D": "Configure one vSphere Distributed Switch for all workload traffic and all NSX - Host and Edge TEP/Edge Uplinks.", "E": "Configure one vSphere Distributed Switch for all NSX - Host and Edge TEP/Edge Uplinks."}, "correct": ["A", "D"], "explanation": "Zone 1 (Management and Storage) uses vDS01 with ESX Management, Storage, and vMotion (A). Zone 2 (Workload) uses vDS02 with all workload traffic and NSX Host/Edge TEPs/Edge Uplinks (D). Option C incorrectly mixes zone 1 management traffic with zone 2 NSX TEPs.", "domain": "NSX"}, {"id": 58, "stem": "The private cloud will operate with three monitoring levels: Self-Managed Service: VM construct only. OS Managed Service: OS metrics and VM construct. Fully Managed Service: Infrastructure apps + OS metrics + VM construct (approved apps: IIS, SQL Server, MySQL, PostgreSQL, Tomcat, Apache HTTPD). Each workload must subscribe to a monitoring level. Minimal management overhead required. Which two design decisions should the architect make? (Choose two.)", "choices": {"A": "Configure the Service Discovery for all workloads that subscribe to the Self-Managed service", "B": "Deploy the Managed Telegraf Agent for all workloads that subscribe to the Fully Managed service", "C": "Deploy the Managed Telegraf Agent for all workloads that subscribe to the OS Managed service", "D": "Deploy the Managed Telegraf Agent for all workloads that subscribe to Self-Managed service", "E": "Deploy the Open Source Telegraf Agent for all workloads that subscribe to the Fully Managed service"}, "correct": ["A", "B"], "explanation": "Service Discovery (A) is the correct tool for Self-Managed (VM construct only) - it provides VM-level visibility without deploying an agent. Managed Telegraf Agent (B) is explicitly documented for Fully Managed service as it supports monitoring infrastructure apps including IIS, SQL Server, MySQL, PostgreSQL, Tomcat, and Apache HTTPD.", "domain": "SDDC Manager"}, {"id": 59, "stem": "Requirements: Third-party virtual appliance does not support overlay networks. The virtual appliance must reside on the same L2 domain as an external physical firewall. The virtual appliance needs access to workloads hosted on NSX overlay segments. Which design decision should the architect make?", "choices": {"A": "Request the third-party vendor to certify the virtual appliance for NSX Overlay segments.", "B": "Connect the virtual appliance to a VLAN-backed segment and configure NSX bridging to allow access to overlay segments.", "C": "Place the virtual appliance and all workloads on VLAN-backed segments.", "D": "Connect the virtual appliance to an overlay-backed segment and use static routes to the firewall."}, "correct": ["B"], "explanation": "NSX bridging extends overlay segments to VLANs at Layer 2. The appliance connects to a VLAN segment (same L2 as physical firewall) while NSX bridging provides L2 connectivity between that VLAN and the overlay segments where workloads live.", "domain": "NSX"}, {"id": 60, "stem": "Financial services organization deploying VCF using vSAN. Requirements: Low-latency high performance storage for critical transactional database workloads. Most efficient capacity utilization for non-critical workloads. Which three design decisions would the architect make for the workload domain cluster? (Choose three.)", "choices": {"A": "Configure vSAN Policies (RAID-5) for all critical transactional database workloads.", "B": "Deploy a vSAN OSA (All-NVMe) cluster with a minimum of 4 nodes.", "C": "Deploy a vSAN ESA cluster with a minimum of 6 nodes.", "D": "Configure vSAN Policies (RAID-5/6) for all non-critical workloads.", "E": "Configure vSAN Policies (RAID-1) for all workloads.", "F": "Configure vSAN Policies (RAID-1) for all critical transactional database workloads."}, "correct": ["C", "D", "F"], "explanation": "vSAN ESA with NVMe (C) provides lowest latency and highest performance. Minimum 6 nodes supports both RAID-5/6 for non-critical and RAID-1 for critical workloads with N+1 resilience. RAID-1 (F) for critical transactional databases provides the lowest write latency. RAID-5/6 (D) for non-critical workloads provides 75%/67% capacity utilization vs RAID-1's 50%.", "domain": "vSAN"}, {"id": 61, "stem": "Which configuration should the architect recommend as part of the design of a VCF solution to ensure optimal performance in a multi-tenant environment?", "choices": {"A": "Use a single large datastore for all tenants to simplify management.", "B": "Configure all workloads to operate on a single ESXi host to minimize network latency.", "C": "Implement vSAN with tiered storage policies to ensure high I/O performance and low latency for tenant workloads.", "D": "Allow an unlimited number of virtual machines per host to consume all available resources."}, "correct": ["C"], "explanation": "vSAN storage policies provide Policy Driven QoS: 'Limit IOPS per VM or VMDK. Reduce impact of noisy neighbors.' Tiered storage policies ensure different tenant SLA tiers get appropriate performance while preventing any tenant from consuming all storage I/O.", "domain": "vSAN"}, {"id": 62, "stem": "As part of designing VCF Operations deployment for a central datacenter and multiple remote sites in different countries. Requirements: REQ#001: Single pane of glass for performance, alerts, and capacity. REQ#002: Local data collection at remote sites to prevent data loss from unstable WAN. REQ#003: Must comply with local data sovereignty regulations. Which deployment model fulfills all design requirements?", "choices": {"A": "Single VCF fleet with Cloud Proxies in each remote site", "B": "Each remote site will be its own VCF fleet.", "C": "All remote sites will be a single VCF fleet.", "D": "A single fleet with multiple VCF instances"}, "correct": ["A"], "explanation": "A single VCF fleet with one VCF Operations instance provides the single management pane (REQ#001). Cloud Proxies at each remote site act as intermediary to store and forward data (REQ#002). Cloud Proxies in each country keep data local for data sovereignty compliance (REQ#003).", "domain": "VCF"}, {"id": 63, "stem": "During requirements gathering, the following was captured: The solution must support running 50,000 workloads concurrently across all sites. The solution must support the concurrent deployment of up to 10 workloads. When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Recoverability", "B": "Performance", "C": "Availability", "D": "Manageability"}, "correct": ["B"], "explanation": "The Lecture Manual defines Performance as 'Provides the required amount of work using the least amount of time and resources' with measurements of 'Throughput, latency, transactions per second.' Both requirements describe concurrent work capacity.", "domain": "SDDC Manager"}, {"id": 64, "stem": "During requirements gathering, the following was captured: The solution must support the monitoring of up to 10,000 objects. The solution must support 24 months retention for all monitoring data. When creating the design document, which design quality should be used to classify the stated requirements?", "choices": {"A": "Performance", "B": "Manageability", "C": "Availability", "D": "Recoverability"}, "correct": ["B"], "explanation": "Manageability is defined as 'Managing the infrastructure in terms of lifecycle management, scalability, and capacity planning.' 10,000 objects is a scalability requirement. 24-month retention is a capacity planning requirement.", "domain": "SDDC Manager"}, {"id": 65, "stem": "As part of an initial stakeholder meeting, one of the stakeholders has stated: 'The initial design must be completed within the next 3 months so that hardware can be ordered within the current budget cycle.' How would the architect classify and record this statement?", "choices": {"A": "A constraint", "B": "A risk", "C": "An assumption", "D": "A requirement"}, "correct": ["A"], "explanation": "The Lecture Manual lists 'Project timeline' and 'Project budget' as explicit examples of constraints. The 3-month deadline and budget cycle are confirmed, non-negotiable boundaries imposed from outside that remove the architect's ability to decide on timing.", "domain": "SDDC Manager"}, {"id": 66, "stem": "Requirement: The solution must include high security hardening levels to meet military compliance standards. Which two physical design decisions will meet this security requirement in the workload domain? (Choose two.)", "choices": {"A": "The vSAN storage policy will be configured as Secondary Failures to Tolerate = 1.", "B": "VCF Operations will be configured to renew the SSL certificate for vCenter Server per security policies.", "C": "NTP will be configured to the internal NTP servers of 192.168.12.1 and 192.168.24.1.", "D": "The advanced setting UserVars.SuppressShellWarning will be configured to 0 across all ESXi hosts.", "E": "The certificate of the VI workload domain vCenter Server will be issued by RootCA.Military.Domain.Com."}, "correct": ["D", "E"], "explanation": "Design requirement VCF-ESX-RCMD-SEC-001: 'Set UserVars.SuppressShellWarning to 0 across all ESX hosts - ensures compliance with the vSphere Security Configuration Guide.' Design requirement VCF-SEC-RCMD-CERT-001: 'Replace default VMCA certificates with a certificate signed by an internal certificate authority.'", "domain": "vSAN"}, {"id": 67, "stem": "As part of the initial design workshop, one of the customer stakeholders has stated: 'All Virtual Machines must be encrypted.' How would the architect classify this statement?", "choices": {"A": "A Risk", "B": "A Constraint", "C": "A Requirement", "D": "An Assumption"}, "correct": ["C"], "explanation": "A requirement allows the architect to evaluate multiple design options. 'All VMs must be encrypted' defines what must be done but leaves multiple implementation options: vSphere VM Encryption, vSAN data-at-rest encryption, guest OS encryption, or third-party solutions.", "domain": "vSAN"}, {"id": 68, "stem": "An architect has compiled a list of statements following a workshop with the business stakeholders. Which statement would be included in a conceptual model?", "choices": {"A": "The solution must meet a Mean Time To Recovery (MTTR) of 6 hours.", "B": "Sites A and B will each have a stretched Layer-2 for their management network.", "C": "The 'das.isolationshutdowntimeout' setting will be configured to 120 seconds.", "D": "Users will connect to the application servers via the NSX Advanced Load Balancer."}, "correct": ["A"], "explanation": "MTTR of 6 hours is a Recoverability requirement captured during stakeholder workshops - it belongs in the Conceptual Model. Stretched Layer-2 (B) is Logical Design. das.isolationshutdowntimeout=120 seconds (C) is Physical Design. NSX Advanced Load Balancer (D) is Logical Design.", "domain": "NSX"}, {"id": 69, "stem": "Requirements: Capture events from all infrastructure components. Single pane of glass for troubleshooting, alerting, and monitoring using metrics, events, and flows. 99.9% Service Level Agreement for Availability. Which three design decisions should the architect make? (Choose three.)", "choices": {"A": "Configure VCF Operations for logs to capture events from only VCF Management components.", "B": "Configure the integration for VCF Operations and VCF Automation.", "C": "Deploy VCF Operations for logs in a Simple model.", "D": "Configure the integration for VCF Operations and VCF Operations for logs.", "E": "Configure VCF Operations for logs to capture events from all VCF infrastructure components.", "F": "Deploy VCF Operations for logs in a High Availability model."}, "correct": ["D", "E", "F"], "explanation": "Capturing events from ALL VCF infrastructure components (E) satisfies REQ1. Integration between VCF Operations and VCF Operations for Logs (D) creates the single pane of glass for REQ2. The HA model (F) satisfies the 99.9% SLA.", "domain": "VCF"}, {"id": 70, "stem": "An architect is designing a new VCF solution. Budget constraints require using existing server hardware from the same vendor but different generations. Ten servers available. Management and Business workloads in different clusters. What design decision should the architect make for lifecycle management?", "choices": {"A": "Use a single vSphere Lifecycle Manager composite image for the management domain cluster.", "B": "Use separate vSphere Lifecycle Manager composite images for the management and workload domain clusters.", "C": "Use vSphere Lifecycle Manager baselines for the management domain cluster.", "D": "Use a single vSphere Lifecycle Manager composite image for the management and workload domain clusters."}, "correct": ["B"], "explanation": "vSphere Lifecycle Manager baselines are NOT supported with VMware Cloud Foundation 9.0 - eliminating C. Separate images for management and workload domain clusters (B) allow independent lifecycle management since different hardware generations may require different firmware/driver combinations per cluster.", "domain": "VCF"}, {"id": 71, "stem": "An architect noted the following business objectives: The solution must prioritize optimal end-to-end user shopping experience for customers accessing the website. The website must be available 24x7x365. Which three conceptual model items relate to these business objectives? (Choose three.)", "choices": {"A": "A requirement to have 99.99% availability uptime measured at the front-end application layer", "B": "A risk that the external internet network provider does not meet the service level agreement (SLA) requirements", "C": "A requirement to have 99.99% availability uptime measured at the network infrastructure layer", "D": "An assumption that site performance is not a key performance indicator (KPI) for the customer", "E": "A constraint of any planned changes limited to outside of business hours only", "F": "An assumption that there is sufficient budget for the design to meet the performance requirements"}, "correct": ["A", "B", "E"], "explanation": "24x7x365 maps to 99.99% availability at the application layer (A). The risk (B) that the external internet provider may not meet SLA is a genuine potential negative event. Changes limited to outside business hours (E) is a constraint because 24x7x365 removes the architect's flexibility on maintenance windows.", "domain": "SDDC Manager"}, {"id": 72, "stem": "Requirement: NSX VPC Full Services Model for single tenant, preventing BGP advertisements from being dropped due to loop detection. Which element should be considered in the physical network design?", "choices": {"A": "Adjust the default BGP timers.", "B": "Use a unique, private BGP AS number for each Tier-0 gateway.", "C": "Use iBGP as the routing protocol between the Tier-0 gateway and the physical network.", "D": "Configure edge datapath interface to transport only TEP traffic."}, "correct": ["B"], "explanation": "BGP loop detection drops routes when a router sees its own AS number in the AS path. Using a unique private AS number (64512-65534) for each Tier-0 gateway ensures no AS path loop detection triggers. The Tier-0 to physical network connection must use eBGP, not iBGP (C).", "domain": "NSX"}, {"id": 73, "stem": "During a discovery workshop: All applications designated as business critical have a Recovery Point Objective (RPO) of 1 business hour. The infrastructure components of the VCF solution must have a Recovery Time Objective (RTO) of 4 business hours. In the context provided, what does the RTO determine?", "choices": {"A": "The maximum tolerable amount of time allowed before an application/service should be recovered to a usable state", "B": "The maximum amount of data loss that can be tolerated", "C": "The minimum tolerable amount of time allowed before an application/service should be recovered to a usable state", "D": "The minimum amount of data loss that can be tolerated"}, "correct": ["A"], "explanation": "RTO (Recovery Time Objective) is the maximum tolerable downtime - how long the infrastructure can be unavailable before it must be restored. 4 hours RTO means VCF infrastructure must be restored within 4 hours of a failure.", "domain": "SDDC Manager"}, {"id": 74, "stem": "An architect is expanding an existing private cloud based on VCF by deploying two additional instances of VCF at two separate datacenters within the existing private cloud with minimal additional footprint. DC-A is 90 miles from existing VCF fleet with 90ms RTT. DC-B is 120 miles with 120ms RTT. Which design decision would meet the requirement?", "choices": {"A": "Deploy two additional VCF instances within the existing VCF fleet, one each in datacenters A and B.", "B": "Deploy two additional VCF fleets, one for each VCF instance in datacenters A and B.", "C": "Deploy an additional VCF fleet in datacenter A and an additional VCF instance within the existing VCF fleet in datacenter B.", "D": "Deploy an additional VCF fleet in datacenter B and an additional VCF instance within the existing VCF fleet in datacenter A."}, "correct": ["D"], "explanation": "Design requirement VCF-NET-REQD-LAT-006 states: 'Ensure maximum latency between VCF Instances in a VCF fleet is under 100ms.' DC-A at 90ms is within the 100ms limit - can be a VCF Instance in the existing fleet. DC-B at 120ms exceeds 100ms - must be a separate VCF fleet.", "domain": "VCF"}, {"id": 75, "stem": "Constraint: Existing stretched cluster must be used. Requirement: Minimize management infrastructure downtime. Which Supervisor deployment model supports the design?", "choices": {"A": "Three Management Zone Supervisor deployment with HA control plane", "B": "Single Management Zone Supervisor deployment with HA control plane", "C": "Three Management Zone deployment with Simple Availability control plane", "D": "Single Management Zone Supervisor deployment with Simple Availability control plane"}, "correct": ["B"], "explanation": "The VCF 9.0 Design Doc confirms: 'The supported Supervisor deployment on a vSAN stretched cluster is a single-zone Supervisor.' Three Management Zone is not supported on a stretched cluster. The HA control plane deploys three Supervisor control plane VMs providing continuous availability.", "domain": "vSAN"}, {"id": 76, "stem": "During a requirements gathering workshop, several business and technical requirements were captured from the customer. Which requirement will be classified as a Business Requirement?", "choices": {"A": "The solution must provide the best end-user experience.", "B": "The solution must allow the migration of legacy server infrastructure.", "C": "The solution must consider security and resiliency to ensure business continuity.", "D": "The solution must provide a component-level SLA of 99.9% or higher."}, "correct": ["B"], "explanation": "Functional (business) requirements describe what a system must do. 'Allow the migration of legacy server infrastructure' is a business action driven by organizational needs. C (security and resiliency) maps to non-functional technical requirements. D (99.9% SLA) is a non-functional Availability requirement.", "domain": "SDDC Manager"}, {"id": 77, "stem": "An architect gathered the following requirements for a Supervisor image store: Image scanning, Replication, Image signing. What component would the architect recommend?", "choices": {"A": "Harbor", "B": "Azure ACR", "C": "Gitea", "D": "Docker Hub"}, "correct": ["A"], "explanation": "The Lecture Manual confirms: 'Harbor: Open-source, cloud-native container image registry that doesn't just store your images. It also signs and scans them.' Harbor supports all three requirements: image scanning, replication, and image signing. It is the VMware-native recommended registry.", "domain": "SDDC Manager"}, {"id": 78, "stem": "Which statement would be classified as a functional (business) requirement?", "choices": {"A": "The solution must provide the ability for users to view and track the progress of their requests.", "B": "The self-service catalog must meet the Service Level Objective (SLO) of 75% successful requests measured over a 12-month period.", "C": "Applications must be designed to tolerate the failure of a single datacenter.", "D": "Third-party pen testing must be executed against the solution yearly with a pass rate of 80 percent or higher."}, "correct": ["A"], "explanation": "Functional requirements describe what a system must do for users or business. 'Provide the ability for users to view and track progress of requests' is a capability the system must perform. B is a non-functional Performance metric. C is a non-functional Availability design quality. D is a non-functional Security operational requirement.", "domain": "SDDC Manager"}, {"id": 79, "stem": "Which statement defines the purpose of Technical Requirements?", "choices": {"A": "They define which goals and objectives can be achieved.", "B": "They define what goals and objectives need to be achieved.", "C": "They define which audience need to be involved.", "D": "They define how the goals and objectives can be achieved."}, "correct": ["D"], "explanation": "The fundamental distinction: Business/Functiona
