l requirements define WHAT the system must do. Technical/Non-functional requirements define HOW the system achieves those goals - through its characteristics (availability %, performance targets, security controls).", "domain": "SDDC Manager"}, {"id": 80, "stem": "During an initial design workshop, the architect has assumed that the solution will need to support high availability for workloads. Given the assumption, which statement should the architect document as a risk?", "choices": {"A": "The solution supports the separation of management components from production workloads.", "B": "BGP is the dynamic routing protocol on the physical fabric and cannot be changed.", "C": "The solution supports a recovery point objective (RPO) of 24 hours for infrastructure components.", "D": "The entire infrastructure is hosted on a single physical site."}, "correct": ["D"], "explanation": "A risk is a factor that might have a negative effect on the design if the assumption proves incorrect. If all infrastructure is on a single physical site, a site-level failure would make HA impossible. BGP cannot be changed (B) is a constraint. RPO of 24 hours (C) is a recoverability requirement.", "domain": "NSX"}, {"id": 81, "stem": "As part of a VCF solution design, the architect has documented: CONS001 - Internet access will not be permitted from anywhere within VCF. CONS002 - Password must not be stored in plain text anywhere. DEP001 - The customer must make required VCF binaries accessible to VCF Installer during deployment. Which design decision should the architect include for the download of VCF binaries?", "choices": {"A": "The VCF Installer appliance will be configured to connect to an online depot.", "B": "The VCF Installer appliance will be configured to connect to an offline depot.", "C": "The Bundle Transfer Utility will be used on the VCF Installer appliance.", "D": "The VCF Download Tool will be used on the VCF Installer appliance."}, "correct": ["B"], "explanation": "CONS001 (no internet) eliminates the online depot (A). DEP001 states the customer makes binaries accessible - indicating an offline depot will be configured by the customer. The Bundle Transfer Utility (C) was renamed to VCF Download Tool in VCF 9.0.", "domain": "SDDC Manager"}, {"id": 82, "stem": "A VCF Private Cloud encompasses multiple VCF instances within a single VCF Fleet. Requirements: Workloads across DC1 and DC2, support 2FA, reduce operational overhead. Which two design decisions should be documented for the VCF Single Sign-On architecture? (Choose two.)", "choices": {"A": "Deploy VIDB in the management domain of every VCF instance in all sites.", "B": "Deploy VIDB in the management domain of each VCF instance at DC02.", "C": "Configure all additional VCF instances in the same region to point to the VIDB in the first VCF instance at DC02.", "D": "Deploy VIDB in the first VCF instance management domain at DC01.", "E": "Configure all additional VCF instances in the same private cloud to point to the VIDB in the first VCF instance at DC01."}, "correct": ["D", "E"], "explanation": "The VCF Fleet Level SSO Model design requirements state: 'Deploy VCF Identity Broker in the management domain of the first VCF Instance (D).' 'Configure additional VCF Instances in the same VCF private cloud to consume the same VCF Identity Broker configured in the first VCF Instance (E).'", "domain": "VCF"}, {"id": 83, "stem": "A VCF Private Cloud will encompass multiple VCF instances within a single VCF Fleet. Requirements: Monitoring downtime must be minimized. Alerting downtime must be minimized. Which design decision supports these requirements?", "choices": {"A": "Deploy two VCF Operations instances and configure the Aggregator Management Pack.", "B": "Deploy VCF Operations using the Simple model with Collector nodes at remote sites.", "C": "Deploy VCF Operations using the High Availability model with Collector nodes at remote sites.", "D": "Deploy a single VCF Operations instance across a multi-VCF instance fleet."}, "correct": ["C"], "explanation": "The HA model deploys three VCF Operations nodes - a single node failure does not interrupt monitoring or alerting. Simple model is a single node (cannot minimize downtime with SPOF). Collector nodes at remote sites ensure local data collection from each VCF instance across the fleet.", "domain": "VCF"}, {"id": 84, "stem": "A new VCF solution: VCF Fleet into each of DC1 and DC2 datacenters. Two VCF instances (VCF1 and VCF2) into each VCF Fleet. Use existing, supported third-party solution for MFA. Customer wants to minimize risk of single operational task impacting multiple components and avoid single points of failure. Which two design decisions should the architect include for the authentication approach? (Choose two.)", "choices": {"A": "Use the external VCF Identity Broker model.", "B": "Deploy a shared VCF Identity Broker for all VCF Instances across all VCF Fleets.", "C": "Deploy a dedicated VCF Identity Broker for each VCF instance within a VCF Fleet.", "D": "Deploy a shared VCF Identity Broker for all VCF instances within a VCF Fleet.", "E": "Use the embedded VCF Identity Broker model."}, "correct": ["A", "D"], "explanation": "The appliance (external) VIDB model (A) supports third-party identity providers for MFA. Shared VIDB per fleet (D) means an outage impacts only one fleet - 'Balanced Blast Radius.' Shared across all fleets (B) creates the largest blast radius. Embedded model (E) cannot support third-party MFA.", "domain": "VCF"}, {"id": 85, "stem": "Requirements: The network solution must be capable of complete logical isolation. The network solution must be capable of supporting independent upgrade cycles for network stacks. The network solution must be capable of tenant-specific customization of NSX configurations. Design decisions: Single VCF instance, management domain and two workload domains. Which additional design decision meets all stated requirements?", "choices": {"A": "Deploy NSX only in the management domain and use VLAN-backed segments in the workload domains.", "B": "Use a global NSX Federation configuration across workload domains.", "C": "Use a shared NSX instance across both workload domains.", "D": "Deploy a dedicated NSX instance per workload domain."}, "correct": ["D"], "explanation": "Dedicated NSX per workload domain provides: complete logical isolation (independent control planes per WLD), independent upgrade cycles (each WLD's NSX can be upgraded separately), and tenant-specific customization. Shared NSX (C) has 'shared control plane across workload domains' - directly violates complete logical isolation.", "domain": "NSX"}, {"id": 86, "stem": "Which Container Network Interface (CNI) is selected by default in a VMware Kubernetes Service (VKS) workload cluster?", "choices": {"A": "Antrea", "B": "Flannel", "C": "Calico", "D": "Cilium"}, "correct": ["A"], "explanation": "The VCF 9.0 Design Doc states: 'A VKS cluster provisioned by the VKS supports two CNI options: Antrea (default) and Calico. Antrea is the default CNI for new VKS clusters. If you are using Antrea, you do not have to specify it as the CNI during cluster provisioning.'", "domain": "SDDC Manager"}, {"id": 87, "stem": "Which statement would the architect document as a design decision within the logical design?", "choices": {"A": "Service Levels will align with the defined Business Impact Analysis findings.", "B": "The solution must provide the ability to patch an existing template.", "C": "The VMware Distributed Resource Scheduler (DRS) latency sensitivity value will be set to high for the workload cluster.", "D": "vSphere High Availability (HA) will be enabled."}, "correct": ["D"], "explanation": "'vSphere HA will be enabled' describes a component feature being activated - a logical decision. Service Levels aligning with BIA (A) is a Conceptual Model requirement/business outcome statement. DRS latency sensitivity = high (C) is a specific configuration value - Physical Design, not Logical.", "domain": "SDDC Manager"}, {"id": 88, "stem": "Requirements: Co-locate application workloads with VCF management component workloads within the same vSphere cluster. Shared storage always 100% current in event of a single site outage. Have two sites no more than 10 miles apart (10ms latency) connected with high-speed network technology. Protect against outages of a single site designated as an availability zone. Which two storage technologies could meet the stated requirements? (Choose two.)", "choices": {"A": "NVMe over TCP", "B": "NVMe over Fibre Channel (FC)", "C": "VMFS on Fibre Channel (FC)", "D": "vSAN", "E": "vSphere Virtual Volumes (vVols)"}, "correct": ["B", "D"], "explanation": "vSAN Stretched Cluster (D) provides synchronous replication between availability zones (RPO=0), supports two availability zones with witness, works within 10ms RTT. NVMe over FC (B) with a dual-site stretched FC SAN fabric provides shared storage accessible from both sites simultaneously. vVols (E) is deprecated in VCF 9.0.", "domain": "vSAN"}, {"id": 89, "stem": "An architect is tasked to plan for an upgrade of an existing vSphere-only deployment utilizing vSAN to VMware Cloud Foundation (VCF). Which three new infrastructure components are required for the upgrade? (Choose three.)", "choices": {"A": "NSX", "B": "SDDC Manager", "C": "VCF Identity Broker", "D": "VCF Operations", "E": "vSphere Supervisor"}, "correct": ["A", "B", "D"], "explanation": "A vSphere-only environment has vCenter and ESX hosts but is missing NSX (mandatory VCF component), SDDC Manager (mandatory fleet management), and VCF Operations (deployed as part of VCF management stack). VCF Identity Broker is optional SSO configuration. vSphere Supervisor is optional for Kubernetes workloads.", "domain": "NSX"}, {"id": 90, "stem": "Requirement: Ensure all management components are redundant at the component level. Which design quality should classify this requirement?", "choices": {"A": "Performance", "B": "Manageability", "C": "Availability", "D": "Recoverability"}, "correct": ["C"], "explanation": "The Lecture Manual AMPRS table defines Availability as 'Available when needed. No single point of failure. Redundancy levels (N+1, N+2, and so on).' Component-level redundancy directly maps to eliminating single points of failure. Recoverability is about recovering AFTER a failure - redundancy prevents the failure from causing downtime, which is Availability.", "domain": "SDDC Manager"}, {"id": 91, "stem": "While designing a solution, an architect is tasked with defining limits for a vSphere Namespace. What three limits are available? (Choose three.)", "choices": {"A": "The amount of storage", "B": "The amount of containers", "C": "The amount of services", "D": "The amount of memory", "E": "The amount of CPU"}, "correct": ["A", "D", "E"], "explanation": "The Lecture Manual states directly: 'vSphere namespaces define resource limits for CPU, memory, and storage for workloads such as VMs, Kubernetes clusters, and others.' The three available limits are CPU (E), Memory (D), and Storage (A).", "domain": "vSAN"}, {"id": 92, "stem": "Designing BCDR strategy for VCF with management domain and multiple workload domains in two datacenters in the same city. Requirements: RTO for workloads = 24 hours. Management domain must remain continuously available with RPO = 0. Hardware overhead minimized by utilizing standby resources that host test workloads. Operational overhead minimized. Latency = 2ms. Which design decision should the architect document?", "choices": {"A": "Use VCF Automation to redeploy the entire environment in case of a failure.", "B": "Implement vSAN stretched cluster for the management domain and Live Recovery for the workload domains.", "C": "Back up all workloads daily and store them in a central repository to meet RTO expectations.", "D": "Use asynchronous replication for both management and workload domains."}, "correct": ["B"], "explanation": "Management domain RPO=0 requires synchronous replication - vSAN stretched cluster provides this with 2ms latency (within 5ms limit). VMware Live Recovery for workload domains provides SRM-based DR achieving 24-hour RTO with standby resources that host test workloads during normal operation. Asynchronous replication (D) cannot achieve RPO=0.", "domain": "vSAN"}, {"id": 93, "stem": "A VCF Private Cloud solution must: Have service catalog availability SLA of 99.9%. Performance must not be impacted by maintenance activities or single physical ESXi host failure. Logical design decision: Deploy VCF Automation using the highly available deployment model. Which two physical design decisions should the architect make? (Choose two.)", "choices": {"A": "The solution will configure the external load balancer to send all traffic to the native Kubernetes load balancer.", "B": "The solution will deploy three VCF Automation appliances using the small size.", "C": "The solution will create a VM-host affinity rule to ensure all nodes of the VCF Automation cluster are located on the same ESXi host.", "D": "The solution will create a VM-host anti-affinity rule to ensure all nodes of the VCF Automation cluster are located on different ESXi hosts.", "E": "The solution will deploy an external load balancer to replace the native load balancer."}, "correct": ["D", "E"], "explanation": "VM-host anti-affinity rules (D) ensure each of the 3 VCF Automation nodes runs on a different ESXi host - a single host failure only affects one node. External load balancer (E) allows graceful connection draining during maintenance activities. HA model uses medium node size (B small is wrong). VM-host affinity on same host (C) creates a SPOF.", "domain": "VCF"}, {"id": 94, "stem": "Which type of design would include specific details about server hardware, port connections, or Fibre Channel zones?", "choices": {"A": "Logical", "B": "Service", "C": "Physical", "D": "Conceptual"}, "correct": ["C"], "explanation": "The Lecture Manual states: 'The logical design does NOT provide specific details about, for example, server hardware, port connections, or Fibre Channel zones.' The Physical Design includes these specifics and 'lists specific configurations for the hardware and software components.'", "domain": "vSAN"}, {"id": 95, "stem": "The security team provides the following requirement for VCF Automation deployment: All Virtual Machine images must be reviewed and vetted by the security team prior to consumption. Which Content Library type supports the requirement?", "choices": {"A": "Subscribed Content Library", "B": "Tenant-managed Content Library", "C": "Local Content Library", "D": "Provider-managed Content Library"}, "correct": ["D"], "explanation": "The VCF 9.0 Design Doc confirms: 'A VCF Automation provider content library provides a single interface for provider administrators to share content with organizations across regions. The provider content libraries are read-only to the users of the organizations.' The security team acts as provider administrators, reviewing and approving images before publishing.", "domain": "VCF"}, {"id": 96, "stem": "A financial services company is deploying VCF for core banking applications. The architect needs to ensure the design can handle peak transaction loads while maintaining the performance SLA. Which two approaches should be included in the design validation strategy? (Choose two.)", "choices": {"A": "Perform the live recovery test for the master recovery plan to ensure the Recovery Time Objective (RTO) is within the defined SLA.", "B": "Conduct stress testing using representative workloads to evaluate system behavior under extreme load conditions.", "C": "Simulate peak transaction loads in a staging environment to validate resource scalability and vSAN performance.", "D": "Deploy the solution to production first and optimize based on live performance feedback from end users.", "E": "Rely on vendor-supplied performance benchmarks that were provided for the selected hardware and validate manually the Live Recovery configuration."}, "correct": ["B", "C"], "explanation": "Stress testing with representative workloads (B) validates the system under extreme load conditions matching realistic banking transaction patterns. Simulating peak loads in a staging environment (C) validates resource scalability and vSAN performance before production deployment.", "domain": "vSAN"}, {"id": 97, "stem": "As part of an initial stakeholder meeting, one of the stakeholders has stated the following: According to the hardware standards, all new host server hardware must be deployed using our selected hardware vendor and server model. How would the architect classify this statement?", "choices": {"A": "An assumption", "B": "A constraint", "C": "A requirement", "D": "A risk"}, "correct": ["B"], "explanation": "A constraint is an externally imposed restriction that limits the architect's design choices without flexibility. Mandating a specific hardware vendor and server model removes the architect's freedom to choose hardware, making it a classic constraint.", "domain": "SDDC Manager"}, {"id": 98, "stem": "A large financial institution is designing a VMware Cloud Foundation (VCF) solution. During initial discovery meetings: Management of the physical network is outsourced. VMware team cannot reconfigure the physical network. Environment uses Link Aggregation. How does this impact design?", "choices": {"A": "NIC teaming for Virtual Standard Switch (vSS) must be configured.", "B": "LACP fallback must be configured.", "C": "Link Aggregation cannot be used for Workload Domains.", "D": "Link Aggregation cannot be used in the Management Domain."}, "correct": ["B"], "explanation": "Since the physical network uses Link Aggregation and the VMware team cannot reconfigure it, the VDS must be configured to operate with LACP as presented by the physical environment. LACP fallback must be configured to ensure uplinks remain functional during LACP negotiation periods. Link Aggregation (LACP) is supported on VDS for both Management and Workload Domains.", "domain": "VCF"}, {"id": 99, "stem": "Which statement would the architect document as a design decision within the logical design?", "choices": {"A": "The solution must provide the ability to patch an existing template.", "B": "vSphere High Availability (HA) will be enabled.", "C": "Service Levels will align with the defined Business Impact Analysis findings.", "D": "The VMware Distributed Resource Scheduler (DRS) latency sensitivity value will be set to high for the workload cluster."}, "correct": ["D"], "explanation": "Setting the DRS latency sensitivity value to high for the workload cluster is a precise, actionable configuration decision that belongs in the logical design. Option A is a functional requirement. Option B (vSphere HA will be enabled) is a valid design decision but less specific than Option D. Option C describes a business alignment statement, not a design decision.", "domain": "SDDC Manager"}, {"id": 100, "stem": "An architect has compiled a list of design choices following a design workshop with the business stakeholders. Which statement represents a logical design decision?", "choices": {"A": "Synchronous data replication will be used to meet the stated Recovery Point Objective (RPO) between site A and B.", "B": "Users must experience application availability in under 2 seconds.", "C": "Sites A and B will each have a /16 subnet for their networks.", "D": "Users must connect to the application servers via a shared Global Load Balancer."}, "correct": ["A"], "explanation": "Choosing synchronous data replication to meet a specific RPO between sites is a technology decision (logical) that addresses a business requirement. Option B is a business requirement. Option C specifying a /16 subnet is a physical/IP addressing design detail. Option D describes a requirement, not a design decision made by the architect.", "domain": "SDDC Manager"}];
const TOTAL = QUESTIONS_RAW.length, STORE_KEY="vcf_exam_state_v2", HISTORY_KEY="vcf_exam_history_v2";
let state = loadState() || {mode:"menu",questions:[],current:0,selected:{},submitted:{},bookmarked:{},wrongIds:[],startedAt:null,elapsed:0,timerOn:false,score:null,domain:"All"};
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))} function loadState(){try{return JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){return null}}
function clearSaved(){localStorage.removeItem(STORE_KEY);state={mode:"menu",questions:[],current:0,selected:{},submitted:{},bookmarked:{},wrongIds:[],startedAt:null,elapsed:0,timerOn:false,score:null,domain:"All"};render()}
function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]}catch(e){return[]}} function saveHistory(r){const h=history();h.unshift(r);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,30)))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]))}
function setState(p){state={...state,...p};saveState();render()}
function buildQuestion(raw){const labels=["A","B","C","D","E","F"],keys=Object.keys(raw.choices),sk=shuffle(keys),nc={},map={};sk.forEach((k,i)=>{nc[labels[i]]=raw.choices[k];map[k]=labels[i]});return {...raw,choices:nc,correct:raw.correct.map(c=>map[c]).sort()}}
function startExam(count,domain="All",wrongOnly=false){let pool=wrongOnly?QUESTIONS_RAW.filter(q=>(state.wrongIds||[]).includes(q.id)):QUESTIONS_RAW;if(domain!="All")pool=pool.filter(q=>q.domain==domain);pool=shuffle(pool).slice(0,Math.min(count,pool.length)).map(buildQuestion);setState({mode:"exam",questions:pool,current:0,selected:{},submitted:{},bookmarked:{},startedAt:Date.now(),elapsed:0,timerOn:true,score:null,domain})}
function toggleChoice(label){const q=state.questions[state.current];if(!q||state.submitted[state.current]!==undefined)return;const cur=state.selected[state.current]||[],multi=q.correct.length>1;let next=multi?(cur.includes(label)?cur.filter(x=>x!=label):(cur.length<q.correct.length?[...cur,label]:cur)):[label];setState({selected:{...state.selected,[state.current]:next}})}
function submitAnswer(){const q=state.questions[state.current],cur=state.selected[state.current]||[];if(!q||!cur.length)return;const ok=[...cur].sort().join("")===[...q.correct].sort().join("");const wrongIds=ok?state.wrongIds.filter(id=>id!=q.id):Array.from(new Set([...(state.wrongIds||[]),q.id]));setState({submitted:{...state.submitted,[state.current]:ok},wrongIds})}
function toggleBookmark(){setState({bookmarked:{...state.bookmarked,[state.current]:!state.bookmarked[state.current]}})}
function fmt(sec){sec=Math.floor(sec||0);return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")} function elapsedSec(){return state.startedAt?Math.floor((Date.now()-state.startedAt)/1000):state.elapsed||0}
function finishExam(){let correct=0,byDomain={};state.questions.forEach((q,i)=>{const sel=state.selected[i]||[],ok=[...sel].sort().join("")===[...q.correct].sort().join("");if(ok)correct++;byDomain[q.domain]??={total:0,correct:0};byDomain[q.domain].total++;if(ok)byDomain[q.domain].correct++});const score={correct,total:state.questions.length,answered:Object.keys(state.submitted).length,elapsed:elapsedSec(),date:new Date().toLocaleString(),byDomain};saveHistory(score);setState({mode:"review",score,timerOn:false,elapsed:score.elapsed})}
setInterval(()=>{if(state.mode=="exam"&&state.timerOn){let t=document.getElementById("timer");if(t)t.textContent=fmt(elapsedSec())}},1000);
function menu(){const h=history(),wrong=(state.wrongIds||[]).length;return `<div class="page"><div class="hero"><span class="badge">2V0-13.25</span><h1>VCF Architect<br>Practice Exam</h1><p class="subtitle">${TOTAL} questions | Bookmarks | Resume | Timer | Analytics</p></div><div class="grid"><button class="cardbtn" onclick="startExam(20)"><b>Quick Fire</b><span class="count">20Q</span><span class="small">Random practice</span></button><button class="cardbtn" onclick="startExam(50)"><b>Half Exam</b><span class="count">50Q</span><span class="small">Medium session</span></button><button class="cardbtn" onclick="startExam(100)"><b>Full Exam</b><span class="count">100Q</span><span class="small">Complete set</span></button><button class="cardbtn" onclick="startExam(100,'All',true)" ${wrong?'':'disabled'}><b>Wrong Answer Review</b><span class="count">${wrong}</span><span class="small">Retake missed questions</span></button></div><div class="domainbar">${["VCF","NSX","vSAN","SDDC Manager"].map(d=>`<button class="btn" onclick="startExam(100,'${d}')">${d}</button>`).join("")}</div><div class="card"><h2>Score History</h2>${h.length?`<div class="statgrid">${h.slice(0,6).map(x=>`<div class="stat"><b>${Math.round(x.correct/x.total*100)}%</b><br><span class="small">${x.correct}/${x.total} | ${fmt(x.elapsed||0)}</span><br><span class="small">${x.date}</span></div>`).join("")}</div>`:`<p class="muted">No completed exams yet.</p>`}<div class="btnrow" style="margin-top:14px"><button class="btn danger" onclick="clearSaved()">Reset Saved Progress</button></div></div></div>`}
function exam(){const q=state.questions[state.current];if(!q)return menu();const cur=state.selected[state.current]||[],sub=state.submitted[state.current],answered=Object.keys(state.submitted).length,pct=Math.round(answered/state.questions.length*100);const choices=Object.entries(q.choices).map(([l,t])=>{let cls="choice";if(sub!==undefined){if(q.correct.includes(l))cls+=" correct";else if(cur.includes(l))cls+=" wrong"}else if(cur.includes(l))cls+=" selected";return `<button class="${cls}" onclick="toggleChoice('${l}')"><span class="label">${l}</span><span>${esc(t)}</span></button>`}).join("");const fb=sub===undefined?"":`<div class="feedback ${sub?"good":"bad"}"><b>${sub?"Correct":"Incorrect"}</b><br>Correct answer: <b>${q.correct.join(", ")}</b><br><br>${esc(q.explanation)}</div>`;return `<div class="topbar"><div class="topbar-inner"><div class="progress-wrap"><div class="progress-line"><span>Answered ${answered}/${state.questions.length} | Q${state.current+1}</span><span>Timer: <b id="timer">${fmt(elapsedSec())}</b></span></div><div class="progress"><div style="width:${pct}%"></div></div></div><div class="btnrow"><button class="btn" onclick="setState({mode:'menu'})">Menu</button><button class="btn danger" onclick="finishExam()">Finish</button></div></div></div><div class="page"><div class="card"><span class="pill">${q.domain}</span><span class="pill">Original NO.${q.id}</span><span class="pill">${q.correct.length>1?'Choose '+q.correct.length:'Choose one'}</span><button class="btn" style="float:right" onclick="toggleBookmark()">${state.bookmarked[state.current]?'★ Bookmarked':'☆ Bookmark'}</button><p class="stem">${esc(q.stem)}</p>${choices}${fb}<div class="nav"><div class="btnrow"><button class="btn" onclick="setState({current:Math.max(0,state.current-1)})" ${state.current===0?'disabled':''}>Previous</button><button class="btn" onclick="setState({current:Math.min(state.questions.length-1,state.current+1)})" ${state.current===state.questions.length-1?'disabled':''}>Next</button></div><button class="btn primary" onclick="submitAnswer()" ${cur.length===0||sub!==undefined?'disabled':''}>Submit Answer</button></div></div></div>`}
function review(){const s=state.score;if(!s)return menu();const pct=Math.round(s.correct/s.total*100);const items=state.questions.map((q,i)=>{const sel=state.selected[i]||[],ok=[...sel].sort().join("")===[...q.correct].sort().join("");return `<div class="reviewitem" style="border-left-color:${ok?'#22c55e':'#ef4444'}"><b>Q${i+1} | NO.${q.id} | ${q.domain} | ${ok?'Correct':'Wrong'}</b><p>${esc(q.stem)}</p><p class="small">Your answer: ${sel.join(', ')||'Skipped'} | Correct: ${q.correct.join(', ')}</p><p>${esc(q.explanation)}</p></div>`}).join("");return `<div class="page"><div class="hero"><span class="badge" style="background:${pct>=70?'var(--green)':'var(--red)'}">${pct>=70?'PASS':'FAIL'}</span><h1>${s.correct} / ${s.total}</h1><div class="score">${pct}%</div><p class="muted">Time: ${fmt(s.elapsed||0)}</p><div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="setState({mode:'menu'})">New Exam</button><button class="btn" onclick="window.print()">Print</button></div></div><div class="statgrid">${Object.entries(s.byDomain||{}).map(([d,v])=>`<div class="stat"><b>${Math.round(v.correct/v.total*100)}%</b><br>${d}<br><span class="small">${v.correct}/${v.total}</span></div>`).join("")}</div><div class="review">${items}</div></div>`}
function render(){document.getElementById("app").innerHTML=state.mode=="exam"?exam():state.mode=="review"?review():menu()} render();
</script></body></html>
